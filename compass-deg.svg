<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Dark Metallic Outer Rim Gradient -->
    <radialGradient id="rim-bevel" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#434955" />
      <stop offset="40%" stop-color="#23272e" />
      <stop offset="90%" stop-color="#0f1115" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Dial Surface Gradient -->
    <radialGradient id="dial-face" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2026" />
      <stop offset="75%" stop-color="#111317" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </radialGradient>

    <!-- Brass Highlight / Inner Ring Accent -->
    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c89b3c" />
      <stop offset="50%" stop-color="#f3e08f" />
      <stop offset="100%" stop-color="#8a651b" />
    </linearGradient>

    <!-- North Needle - Red Gradient -->
    <linearGradient id="needle-n-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="100%" stop-color="#cc0000" />
    </linearGradient>
    <linearGradient id="needle-n-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#990000" />
      <stop offset="100%" stop-color="#550000" />
    </linearGradient>

    <!-- South Needle - Silver/Dark Metallic Gradient -->
    <linearGradient id="needle-s-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e6ed" />
      <stop offset="100%" stop-color="#9aa5b1" />
    </linearGradient>
    <linearGradient id="needle-s-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#627d98" />
      <stop offset="100%" stop-color="#334e68" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    
    <!-- Phosphor Glow Filter -->
    <filter id="glow-phosphor" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Glass Reflection Highlight -->
    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Reusable Tick Marks -->
    <path id="tick-major" d="M 400 112 L 400 130" stroke="#00ff66" stroke-width="2.5" stroke-linecap="round"/>
    <path id="tick-med" d="M 400 112 L 400 124" stroke="#00cc52" stroke-width="1.8" stroke-linecap="round"/>
  </defs>

  <!-- ================= BASE / CASING ================= -->
  <circle cx="400" cy="400" r="380" fill="url(#rim-bevel)" filter="url(#drop-shadow)"/>
  
  <!-- Outer Tactical Ribs -->
  <g stroke="#1a1d24" stroke-width="4" opacity="0.6">
    <line x1="400" y1="20" x2="400" y2="30"/>
    <line x1="400" y1="770" x2="400" y2="780"/>
    <line x1="20" y1="400" x2="30" y2="400"/>
    <line x1="770" y1="400" x2="780" y2="400"/>
    <line x1="131" y1="131" x2="138" y2="138"/>
    <line x1="662" y1="662" x2="669" y2="669"/>
    <line x1="131" y1="662" x2="138" y2="655"/>
    <line x1="662" y1="131" x2="669" y2="138"/>
  </g>

  <!-- Inner Bezel Ring -->
  <circle cx="400" cy="400" r="350" fill="none" stroke="#2c313a" stroke-width="6"/>
  <circle cx="400" cy="400" r="344" fill="none" stroke="url(#brass-grad)" stroke-width="2" opacity="0.8"/>
  <circle cx="400" cy="400" r="340" fill="url(#dial-face)"/>

  <!-- ================= DIAL MARKINGS ================= -->

  <!-- TECHNICAL GRID / CROSSHAIRS -->
  <g stroke="#00ff66" opacity="0.15" stroke-width="1">
    <circle cx="400" cy="400" r="180" fill="none" stroke-dasharray="4 4"/>
    <circle cx="400" cy="400" r="100" fill="none"/>
    <line x1="400" y1="140" x2="400" y2="660"/>
    <line x1="140" y1="400" x2="660" y2="400"/>
  </g>

  <!-- 360 DEGREE GRADUATION TICKS -->
  <g filter="url(#glow-phosphor)">
    <!-- 1 Degree Minor Ticks (Dense outer ring pattern) -->
    <circle cx="400" cy="400" r="285" fill="none" stroke="#008837" stroke-width="6" stroke-dasharray="0.6 4.37" opacity="0.6"/>

    <!-- 5 Degree Medium Ticks -->
    <circle cx="400" cy="400" r="282" fill="none" stroke="#00cc52" stroke-width="10" stroke-dasharray="1.2 23.63" opacity="0.8"/>

    <!-- 30 DEGREE MAJOR TICKS & ROTATED NUMERIC LABELS -->
    <!-- 0° / 360° (NORTH) -->
    <use href="#tick-major" transform="rotate(0 400 400)"/>
    <text x="400" y="152" fill="#00ff66" font-family="Courier New, monospace" font-weight="900" font-size="16" text-anchor="middle" transform="rotate(0 400 152)">0°</text>

    <!-- 30° -->
    <use href="#tick-major" transform="rotate(30 400 400)"/>
    <text x="534" y="188" fill="#00ff66" font-family="Courier New, monospace" font-weight="700" font-size="14" text-anchor="middle" transform="rotate(30 534 188)">30°</text>

    <!-- 60° -->
    <use href="#tick-major" transform="rotate(60 400 400)"/>
    <text x="612" y="266" fill="#00ff66" font-family="Courier New, monospace" font-weight="700" font-size="14" text-anchor="middle" transform="rotate(60 612 266)">60°</text>

    <!-- 90° (EAST) -->
    <use href="#tick-major" transform="rotate(90 400 400)"/>
    <text x="648" y="405" fill="#00ff66" font-family="Courier New, monospace" font-weight="900" font-size="16" text-anchor="middle" transform="rotate(90 648 405)">90°</text>

    <!-- 120° -->
    <use href="#tick-major" transform="rotate(120 400 400)"/>
    <text x="612" y="544" fill="#00ff66" font-family="Courier New, monospace" font-weight="700" font-size="14" text-anchor="middle" transform="rotate(120 612 544)">120°</text>

    <!-- 150° -->
    <use href="#tick-major" transform="rotate(150 400 400)"/>
    <text x="534" y="622" fill="#00ff66" font-family="Courier New, monospace" font-weight="700" font-size="14" text-anchor="middle" transform="rotate(150 534 622)">150°</text>

    <!-- 180° (SOUTH) -->
    <use href="#tick-major" transform="rotate(180 400 400)"/>
    <text x="400" y="648" fill="#00ff66" font-family="Courier New, monospace" font-weight="900" font-size="16" text-anchor="middle" transform="rotate(180 400 648)">180°</text>

    <!-- 210° -->
    <use href="#tick-major" transform="rotate(210 400 400)"/>
    <text x="266" y="622" fill="#00ff66" font-family="Courier New, monospace" font-weight="700" font-size="14" text-anchor="middle" transform="rotate(210 266 622)">210°</text>

    <!-- 240° -->
    <use href="#tick-major" transform="rotate(240 400 400)"/>
    <text x="188" y="544" fill="#00ff66" font-family="Courier New, monospace" font-weight="700" font-size="14" text-anchor="middle" transform="rotate(240 188 544)">240°</text>

    <!-- 270° (WEST) -->
    <use href="#tick-major" transform="rotate(270 400 400)"/>
    <text x="152" y="405" fill="#00ff66" font-family="Courier New, monospace" font-weight="900" font-size="16" text-anchor="middle" transform="rotate(270 152 405)">270°</text>

    <!-- 300° -->
    <use href="#tick-major" transform="rotate(300 400 400)"/>
    <text x="188" y="266" fill="#00ff66" font-family="Courier New, monospace" font-weight="700" font-size="14" text-anchor="middle" transform="rotate(300 188 266)">300°</text>

    <!-- 330° -->
    <use href="#tick-major" transform="rotate(330 400 400)"/>
    <text x="266" y="188" fill="#00ff66" font-family="Courier New, monospace" font-weight="700" font-size="14" text-anchor="middle" transform="rotate(330 266 188)">330°</text>
  </g>

  <!-- INNER 10-DEGREE SUBDIVISION RING -->
  <g opacity="0.4" font-family="Arial, sans-serif" font-size="9" fill="#e0e6ed" text-anchor="middle">
    <circle cx="400" cy="400" r="230" fill="none" stroke="#627d98" stroke-width="1" stroke-dasharray="2 4"/>
  </g>

  <!-- CARDINAL DIRECTION LABELS -->
  <g font-family="Impact, Arial Black, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central" filter="url(#glow-phosphor)">
    <text x="400" y="210" fill="#ff3333">N</text>
    <text x="590" y="400" fill="#00ff66">E</text>
    <text x="400" y="590" fill="#00ff66">S</text>
    <text x="210" y="400" fill="#00ff66">W</text>
  </g>

  <!-- ORDINAL LABELS -->
  <g font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#00cc52" text-anchor="middle" dominant-baseline="central" opacity="0.7">
    <text x="530" y="270">NE</text>
    <text x="530" y="530">SE</text>
    <text x="270" y="530">SW</text>
    <text x="270" y="270">NW</text>
  </g>

  <!-- DIAL TEXT -->
  <g font-family="Courier New, monospace" text-anchor="middle" fill="#00ff66" opacity="0.6">
    <text x="400" y="330" font-size="11" letter-spacing="2">360° DEGREE DIAL</text>
    <text x="400" y="470" font-size="10" letter-spacing="1">1° GRADUATIONS</text>
    <text x="400" y="485" font-size="9" fill="#627d98">AZIMUTH SCALE</text>
  </g>

  <!-- ================= SEPARATE COMPASS NEEDLE CODE ================= -->
  <!-- Change the angle in transform="rotate(ANGLE 400 400)" to rotate needle independently -->
  <g id="compass-needle" transform="rotate(22.5 400 400)" filter="url(#drop-shadow)">
    <!-- NORTH NEEDLE (RED) -->
    <polygon points="400,400 378,400 393,130 400,105" fill="url(#needle-n-light)" />
    <polygon points="400,400 422,400 407,130 400,105" fill="url(#needle-n-dark)" />
    <polygon points="400,140 396,260 404,260" fill="#00ff66" filter="url(#glow-phosphor)" opacity="0.9"/>

    <!-- SOUTH NEEDLE (SILVER) -->
    <polygon points="400,400 378,400 393,670 400,695" fill="url(#needle-s-light)" />
    <polygon points="400,400 422,400 407,670 400,695" fill="url(#needle-s-dark)" />
    <circle cx="400" cy="650" r="4" fill="#00ff66" filter="url(#glow-phosphor)" opacity="0.8"/>

    <!-- CENTER PIVOT -->
    <circle cx="400" cy="400" r="32" fill="url(#rim-bevel)"/>
    <circle cx="400" cy="400" r="25" fill="url(#brass-grad)"/>
    <circle cx="400" cy="400" r="18" fill="#0f1115"/>
    <circle cx="400" cy="400" r="8" fill="url(#brass-grad)"/>
    <circle cx="398" cy="398" r="3" fill="#ff3366" opacity="0.8"/>
  </g>

  <!-- ================= GLASS COVER / GLARE EFFECT ================= -->
  <circle cx="400" cy="400" r="341" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
  <path d="M 160 250 A 340 340 0 0 1 640 250 A 340 340 0 0 0 160 250 Z" fill="url(#glass-glare)"/>
  <ellipse cx="400" cy="120" rx="180" ry="40" fill="url(#glass-glare)" opacity="0.6"/>
</svg>
